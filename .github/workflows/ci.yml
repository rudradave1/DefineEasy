name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  test-and-lint:
    name: Test & Lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Run tests and lint
        run: ./gradlew --no-daemon :app:testDebugUnitTest :app:lintDebug --stacktrace --console=plain

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          if-no-files-found: warn
          path: |
            **/build/reports/tests/
            **/build/test-results/

      - name: Upload lint results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lint-results
          if-no-files-found: warn
          path: |
            **/build/reports/lint-results*.html
            **/build/reports/lint-results*.xml

  release-build:
    name: Release Build (R8 verification)
    runs-on: ubuntu-latest
    needs: test-and-lint

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build release (unsigned, R8 enabled)
        run: ./gradlew --no-daemon :app:packageRelease -x :app:lintVitalReportRelease --stacktrace --console=plain
        env:
          KEYSTORE_PASSWORD: ""
          KEY_PASSWORD: ""

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: release-build-artifacts
          if-no-files-found: warn
          path: |
            app/build/outputs/apk/**/*.apk
            app/build/outputs/mapping/release/
            **/build/reports/lint-results-release*.html
